<input type="text" id="componentName" placeholder="Component Name">
<button onclick="generate()">Generate 2</button>

<script>
function generate() {
    const componentName = document.getElementById("componentName").value;

    window.parent.postMessage({
        command: "generate",
        componentName: "test/"+componentName,
        componentCode:  `
import React from 'react';

const ${componentName} = () => {
  return <div>${componentName} Component</div>;
};

export default ${componentName};
` 
    }, "*");
}
</script>

<iframe src="http://google.com"></iframe>
<button onclick="openUrl()">Open Google</button>

<script>
function openUrl() {
    window.parent.postMessage({
        command: "openUrl",
        url: "http://localhost/phpmyadmin"
    }, "*");
}
